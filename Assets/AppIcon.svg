    </linearGradient>
  </defs>
  <rect x="96" y="96" width="832" height="832" rx="190" fill="url(#tile)"/>
  <rect x="98" y="98" width="828" height="828" rx="188" stroke="url(#edge)" stroke-width="4"/>
  <g stroke="url(#mark)" stroke-linecap="round" stroke-linejoin="round">
